name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agricultor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agricultor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/agricultor_test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/agricultor_test
      - name: Generate temporary test auth secret
        shell: bash
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          # Build-time placeholder only; no database query or migration runs in CI.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/agricultor
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/agricultor_test
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/agricultor_test
      - run: npm test
